name: Frontend cleanup validation

on:
  push:
    branches: [chore/frontend-code-health]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - name: Runtime dependency audit summary
        run: |
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/runtime-audit.json', 'utf8'));
          console.log('Runtime audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : {
                source: entry.source,
                name: entry.name,
                severity: entry.severity,
                title: entry.title,
                range: entry.range,
              }),
            }));
          }
          NODE
      - name: Full dependency audit counts
        run: |
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/full-audit.json', 'utf8'));
          console.log('Full audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          NODE
