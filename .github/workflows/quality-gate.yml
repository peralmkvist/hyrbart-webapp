name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npm run test:lifecycle

  browser-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hyrbart-webapp/playwright-report/
          retention-days: 7

  authenticated-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Require Vercel automation bypass secret
        run: test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
      - name: Resolve current PR preview URL
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_SLUG=$(printf '%s' "$GITHUB_HEAD_REF" | tr '/_' '--' | tr '[:upper:]' '[:lower:]')
          PREVIEW_URL="https://hyrbart-webapp-git-${BRANCH_SLUG}-hygglo1.vercel.app"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Using current PR preview: $PREVIEW_URL"
      - name: Wait for matching preview deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            STATUS=$(curl -sS -o /tmp/preview-health.json -w '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$PREVIEW_URL/api/health" || true)

            DEPLOYED_SHA=""
            if [ "$STATUS" = "200" ]; then
              DEPLOYED_SHA=$(python3 -c 'import json; print(json.load(open("/tmp/preview-health.json")).get("commit") or "")' 2>/dev/null || true)
              if [ "$DEPLOYED_SHA" = "$EXPECTED_PREVIEW_SHA" ]; then
                echo "PR preview is running $EXPECTED_PREVIEW_SHA"
                exit 0
              fi
            elif [ "$STATUS" = "302" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "Vercel protection bypass was rejected (HTTP $STATUS). Verify Protection Bypass for Automation and the GitHub secret." >&2
              exit 2
            elif [ "$STATUS" = "503" ]; then
              echo "PR preview health returned HTTP 503. The preview runtime is missing a required dependency/environment variable or the database health check failed." >&2
              cat /tmp/preview-health.json >&2 || true
              exit 3
            fi

            if [ $((attempt % 6)) -eq 0 ]; then
              echo "Waiting for PR preview: HTTP $STATUS, deployed SHA ${DEPLOYED_SHA:-unknown}, expected $EXPECTED_PREVIEW_SHA"
            fi
            sleep 10
          done
          echo "PR preview did not reach $EXPECTED_PREVIEW_SHA within 12 minutes" >&2
          exit 1
      - name: Seed isolated authenticated preview fixture
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hyrbart-e2e")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDC_TOKEN"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          FIXTURE=$(curl -fsSL -X POST "$PREVIEW_URL/api/internal/e2e-fixtures" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "X-Hyrbart-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data "{\"runId\":\"$RUN_ID\"}")
          printf '%s' "$FIXTURE" > tests/.auth-fixture.json
          SUPABASE_URL=$(python3 -c 'import json; print(json.load(open("tests/.auth-fixture.json"))["supabaseUrl"])')
          PUBLISHABLE_KEY=$(python3 -c 'import json; print(json.load(open("tests/.auth-fixture.json"))["publishableKey"])')
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "E2E_TEST_SUPPORT=1" >> "$GITHUB_ENV"
          echo "E2E_FIXTURE_PATH=$GITHUB_WORKSPACE/hyrbart-webapp/tests/.auth-fixture.json" >> "$GITHUB_ENV"
          echo "E2E_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
          echo "E2E_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
      - name: Authenticated preview accessibility and session smoke
        run: npm run test:e2e:auth
      - name: Full listing-to-booking funnel preview E2E
        run: npm run test:e2e:funnel
      - name: Full authenticated lifecycle preview E2E
        run: npm run test:e2e:lifecycle
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-pr-playwright-report
          path: hyrbart-webapp/playwright-report/
          retention-days: 7
      - name: Cleanup authenticated preview fixture
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f tests/.auth-fixture.json ]; then exit 0; fi
          TOKEN_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hyrbart-e2e")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDC_TOKEN"
          python3 - <<'PY' > tests/.cleanup.json
          import json
          f=json.load(open('tests/.auth-fixture.json'))
          print(json.dumps({'runId':f['runId'],'bookingIds':list(f['bookings'].values()),'userIds':[f['users']['renter']['id'],f['users']['owner']['id']]}))
          PY
          curl -fsSL -X DELETE "$PREVIEW_URL/api/internal/e2e-fixtures" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "X-Hyrbart-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data-binary @tests/.cleanup.json >/dev/null

  authenticated-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Wait for matching production deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            DEPLOYED_SHA=$(curl -fsSL https://www.hyrbart.se/api/health 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
            if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
              echo "Production is running $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach $GITHUB_SHA within 12 minutes" >&2
          exit 1
      - name: Seed isolated production fixture
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hyrbart-e2e")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDC_TOKEN"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          FIXTURE=$(curl -fsSL -X POST https://www.hyrbart.se/api/internal/e2e-fixtures \
            -H "X-Hyrbart-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data "{\"runId\":\"$RUN_ID\"}")
          printf '%s' "$FIXTURE" > tests/.auth-fixture.json
          echo "E2E_FIXTURE_PATH=$GITHUB_WORKSPACE/hyrbart-webapp/tests/.auth-fixture.json" >> "$GITHUB_ENV"
          echo "E2E_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
          echo "E2E_BASE_URL=https://www.hyrbart.se" >> "$GITHUB_ENV"
      - name: Authenticated accessibility E2E
        run: npx playwright test tests/e2e/authenticated-accessibility.spec.ts --project=chromium-desktop
      - name: Full listing-to-booking funnel E2E
        run: npm run test:e2e:funnel
      - name: Full authenticated lifecycle E2E
        run: npm run test:e2e:lifecycle
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-main-playwright-report
          path: hyrbart-webapp/playwright-report/
          retention-days: 7
      - name: Cleanup production fixture
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f tests/.auth-fixture.json ]; then exit 0; fi
          TOKEN_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hyrbart-e2e")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDIDC_TOKEN"
          python3 - <<'PY' > tests/.cleanup.json
          import json
          f=json.load(open('tests/.auth-fixture.json'))
          print(json.dumps({'runId':f['runId'],'bookingIds':list(f['bookings'].values()),'userIds':[f['users']['renter']['id'],f['users']['owner']['id']]}))
          PY
          curl -fsSL -X DELETE https://www.hyrbart.se/api/internal/e2e-fixtures \
            -H "X-Hyrbart-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data-binary @tests/.cleanup.json >/dev/null
