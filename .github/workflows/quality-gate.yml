name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npm run test:lifecycle

  browser-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyrbart-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hyrbart-webapp/package.json
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hyrbart-webapp/playwright-report/
          retention-days: 7
